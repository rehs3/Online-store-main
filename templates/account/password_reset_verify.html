{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:80px;">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card" style="background:#3b3535; color:#fff; padding:40px; border-radius:8px;">
        <h3 class="text-center">Digite o código de verificação</h3>
        <p class="text-center">O codigo foi enviado para seu email</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="form-row justify-content-center" style="letter-spacing:10px; font-size:28px;">
            <input class="form-control col-2 mx-1" name="code" style="text-align:center; max-width:60px; display:inline-block;">
          </div>
          <div style="height:24px"></div>
          <button class="btn btn-warning btn-block" type="submit">Próximo</button>
        </form>
        <p class="text-center"><a href="{% url 'account:password_reset_request' %}" style="color:#d1d100;">Reenviar</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
