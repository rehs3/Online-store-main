{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:80px;">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card" style="background:#3b3535; color:#fff; padding:30px; border-radius:8px;">
        <h3 class="text-center">Redefinir Senha</h3>
        <form method="post">{% csrf_token %}
          <div class="form-group">
            <label for="email">Email/Telefone</label>
            <input class="form-control" id="email" name="email" placeholder="Email/Telefone">
          </div>
          <button class="btn btn-warning btn-block" type="submit">Próximo</button>
          <div style="height:12px"></div>
          <button type="button" class="btn btn-secondary btn-block" onclick="history.back()">Voltar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
